<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravilog</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/java.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/cpp.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/csharp.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/go.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/rust.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/markdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/plaintext.min.js"></script>
<style>
:root{--sidebar-w:clamp(320px,24vw,420px);--editor-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;--editor-font-size:15px;--editor-code-font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--editor-font-family);background:#fff;color:#1a1a2e;height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
.main{display:flex;flex:1;overflow:hidden}

.doc-wrap{--gravity-depth:0;--gravity-motion:0;--gravity-shift:0px;--gravity-shadow:0px;--gravity-blur:0px;--gravity-stretch:1;flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0 clamp(28px,5vw,96px);position:relative;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,250,252,.82) 48%,rgba(241,245,249,.72))}
.doc-wrap::before{content:'';position:absolute;inset:-18px 0;pointer-events:none;background:linear-gradient(90deg,transparent 0,transparent calc(50% - 431px),rgba(99,102,241,.055) calc(50% - 430px),transparent calc(50% - 428px),transparent calc(50% + 428px),rgba(45,212,191,.055) calc(50% + 430px),transparent calc(50% + 431px)),repeating-linear-gradient(180deg,rgba(148,163,184,.09) 0 1px,transparent 1px 96px);background-position:0 calc(var(--gravity-depth)*-120px + var(--gravity-shift));opacity:calc(.2 + var(--gravity-motion)*.55);filter:blur(var(--gravity-blur));transform:scaleY(var(--gravity-stretch));transform-origin:center;mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 78%,transparent 100%);transition:opacity .08s ease-out,filter .08s ease-out,transform .08s ease-out}
.doc-wrap::after{content:'';position:absolute;left:0;right:0;top:0;height:118px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.72) 54%,transparent),linear-gradient(180deg,rgba(99,102,241,calc(var(--gravity-motion)*.14)),transparent 70%);z-index:2}
.doc{flex:1;width:min(100%,860px);margin:0 auto;padding:52px 0 96px;overflow-y:auto;font-family:var(--editor-font-family);font-size:var(--editor-font-size);line-height:1.8;outline:none;word-break:break-word;position:relative;z-index:3}
.doc :where([style],font){font-family:var(--editor-font-family)!important;font-size:inherit!important;line-height:inherit!important}
.doc :where(p,div,span,a,li,blockquote,td,th,font){font-family:var(--editor-font-family);font-size:inherit}
.doc :where(pre,code,pre span){font-family:var(--editor-code-font-family)}
.doc :where(pre,code,pre span)[style]{font-family:var(--editor-code-font-family)!important;font-size:13px!important}
.doc :where(.katex,.katex *){font-family:KaTeX_Main,Times New Roman,serif}
.doc.gravity-flow>*{text-shadow:0 var(--gravity-shadow) calc(var(--gravity-motion)*30px) rgba(15,23,42,.28);transition:text-shadow .08s ease-out}
.doc.gravity-flow>*.gravity-past{opacity:1;filter:none}
@media (max-width:980px){
  .doc{padding-top:48px}
}
.doc:empty::before{content:'开始写点什么...';color:#d0d0d0;pointer-events:none}
.doc h1,.doc h2,.doc h3,.doc h4{margin:12px 0 4px;line-height:1.4}
.doc h1{font-size:24px}.doc h2{font-size:20px}.doc h3{font-size:17px}.doc h4{font-size:15px;font-weight:700}
.doc table{border-collapse:collapse;width:100%;margin:8px 0}
.doc table td,.doc table th{border:1px solid #d0d0d0;padding:6px 10px;min-width:60px;font-size:inherit;outline:none}
.doc table th{background:#f7f7f7;font-weight:600}
.doc img{max-width:100%;border-radius:4px;margin:6px 0;cursor:pointer;transition:outline .15s;vertical-align:bottom}
.doc img.sel-img{outline:2px solid #667eea;outline-offset:2px}
.doc img.align-left{display:block;margin-right:auto;margin-bottom:6px;max-width:50%;float:none}
.doc img.align-center{display:block;margin-left:auto;margin-right:auto;float:none;max-width:100%}
.doc img.align-right{display:block;margin-left:auto;margin-bottom:6px;max-width:50%;float:none}
.doc blockquote{border-left:3px solid #667eea;padding-left:12px;color:#666;margin:6px 0}
.doc a,.presenter-content a{color:#2563eb;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.doc a:hover,.presenter-content a:hover{color:#1d4ed8}
.doc ul,.doc ol{margin-left:24px;margin-top:4px;margin-bottom:4px;padding-left:0}
.doc ul ul,.doc ol ol,.doc ul ol,.doc ol ul{margin-left:20px}
.doc pre{background:#f6f8fa;padding:28px 14px 14px;border-radius:6px;overflow-x:auto;font-size:13px;margin:8px 0;position:relative;border:1px solid #e1e4e8}
.doc pre:hover .code-lang{opacity:1}
.doc pre:hover .code-dots{opacity:1}
.doc code{background:#f0f0ff;padding:2px 5px;border-radius:3px;font-size:13px}
.doc pre code{background:none;padding:0;font-size:13px;display:block;min-height:18px;outline:none;white-space:pre}
.code-lang{position:absolute;top:6px;right:8px;font-size:10px;color:#666;opacity:.72;transition:opacity .2s;cursor:pointer;background:#fff;padding:2px 18px 2px 6px;border-radius:4px;border:1px solid #e1e4e8;outline:none}
.code-lang:focus{opacity:1;border-color:#667eea}
.code-dots{position:absolute;top:6px;left:10px;font-size:10px;color:#999;opacity:0;letter-spacing:2px}
.todo-item{display:flex;align-items:flex-start;gap:8px;margin:4px 0;line-height:1.8}
.todo-item input[type="checkbox"]{margin-top:5px;width:16px;height:16px;accent-color:#667eea;cursor:pointer;flex-shrink:0}
.todo-item.checked .todo-text{text-decoration:line-through;color:#aaa}
.tex{background:#f8f8ff;padding:1px 4px;border-radius:3px;cursor:pointer;font-family:inherit}
.tex:hover{background:#eef}
.tex-display{display:block;text-align:center;margin:8px 0;padding:6px;background:#fafaff;border-radius:4px;cursor:pointer}
.tex-display:hover{background:#eef}

.fbar{position:fixed;top:12px;left:calc((100vw - var(--sidebar-w))/2);transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:12px;padding:5px 8px;display:flex;align-items:center;gap:2px;box-shadow:0 10px 30px rgba(15,23,42,.1),0 1px 2px rgba(15,23,42,.06);z-index:100;backdrop-filter:blur(14px)}
.fbar button{background:none;border:none;border-radius:8px;width:31px;height:31px;cursor:pointer;color:#5f6673;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,box-shadow .15s,transform .15s}
.fbar button:hover{background:#f4f6ff;color:#20263a;box-shadow:inset 0 0 0 1px rgba(102,126,234,.08)}
.fbar button:active{transform:translateY(1px)}
.fbar button:disabled{opacity:.3;cursor:default;pointer-events:none}
.fbar button svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fbar button .solid{fill:currentColor;stroke:none}
.fbar button .txt{font-size:15px;font-weight:700;line-height:1;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.fbar button .txt.italic{font-style:italic}
.fbar .split{display:flex;align-items:center;gap:0}
.fbar .split button:first-child{border-radius:8px 4px 4px 8px}
.fbar .split button:last-child{width:21px;border-radius:4px 8px 8px 4px}
.fbar .split button:last-child svg{width:13px;height:13px}
.fbar .color-mark{position:relative}
.fbar .color-mark::after{content:'';position:absolute;left:7px;right:7px;bottom:5px;height:2px;border-radius:2px;background:var(--mark-color,#ffeb3b)}
.fbar .theme-sun{display:none}
body.dark .fbar .theme-moon{display:none}
body.dark .fbar .theme-sun{display:block}
.fbar .sep{width:1px;height:18px;background:#e8e8e8;margin:0 3px}
.fbar .st{margin-left:6px;font-size:10px;color:#bbb;white-space:nowrap}

.color-picker{display:none;position:fixed;z-index:200;background:#fff;border:1px solid #e0e0e0;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);padding:10px;width:auto}
.color-picker.show{display:block}
.color-picker .color-grid{display:flex;gap:6px;flex-wrap:wrap}
.color-picker .color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border .15s,transform .15s}
.color-picker .color-dot:hover{transform:scale(1.2)}
.color-picker .color-dot.active{border:2px solid #fff;box-shadow:0 0 0 1px #333}
.color-picker .color-remove{width:24px;height:24px;border-radius:50%;cursor:pointer;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;transition:background .15s}
.color-picker .color-remove:hover{background:#f5f5f5}

.doc span.hl{border-radius:2px;padding:1px 0}

.ctx-bar{position:fixed;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:4px 6px;display:none;gap:2px;box-shadow:0 2px 12px rgba(0,0,0,0.1);z-index:150;align-items:center;flex-wrap:wrap}
.ctx-bar.show{display:flex}
.ctx-bar button{background:none;border:none;border-radius:4px;height:26px;padding:0 8px;cursor:pointer;font-size:11px;color:#555;white-space:nowrap}
.ctx-bar button:hover{background:#f0f0ff;color:#333}
.ctx-bar .sep{width:1px;height:16px;background:#e0e0e0;margin:0 2px}

.tex-input{display:none;position:fixed;z-index:200;background:#fff;border:1px solid #e0e0e0;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);padding:14px;width:360px}
.tex-input.show{display:block}
.tex-input textarea{width:100%;min-height:60px;border:1px solid #ddd;border-radius:6px;padding:8px;font-size:14px;font-family:monospace;outline:none;resize:vertical}
.tex-input textarea:focus{border-color:#667eea}
.tex-input .ti-preview{min-height:30px;margin:8px 0;text-align:center;overflow-x:auto}
.tex-input .ti-btns{display:flex;gap:6px;justify-content:flex-end}
.tex-input .ti-btns button{padding:6px 16px;border-radius:6px;border:1px solid #ddd;font-size:13px;cursor:pointer}
.tex-input .ti-btns .ok{background:#667eea;color:#fff;border-color:#667eea}

.img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;cursor:pointer}
.img-modal.show{display:flex}
.img-modal img{max-width:90%;max-height:90%;border-radius:4px}

.presenter{display:none;position:fixed;inset:0;z-index:850;background:#f8fafc;color:#111827;overflow:auto;padding:clamp(32px,7vh,72px) clamp(28px,8vw,120px)}
.presenter.show{display:block;cursor:none}
.presenter.show *{cursor:none!important}
.presenter-close{position:fixed;top:18px;right:18px;width:36px;height:36px;border:1px solid rgba(148,163,184,.34);border-radius:50%;background:rgba(255,255,255,.84);color:#475569;font-size:24px;line-height:1;cursor:pointer;z-index:2;backdrop-filter:blur(10px)}
.presenter-close:hover{background:#fff;color:#111827}
.presenter-stage{min-height:100%;display:flex;align-items:center;justify-content:center}
.laser-pointer{position:fixed;left:0;top:0;width:18px;height:18px;border-radius:50%;pointer-events:none;z-index:4;opacity:0;transform:translate3d(-50%,-50%,0);background:#ff2d55;box-shadow:0 0 0 5px rgba(255,45,85,.18),0 0 24px 8px rgba(255,45,85,.48),0 0 72px 18px rgba(255,45,85,.18);transition:opacity .12s ease-out}
.presenter.show .laser-pointer.on{opacity:1}
.presenter-content{width:min(100%,980px);font-family:var(--editor-font-family);font-size:22px;line-height:1.8;word-break:break-word}
.presenter-content :where(p,div,span,a,li,blockquote,td,th){font-family:var(--editor-font-family);font-size:inherit}
.presenter-content :where(pre,code,pre span){font-family:var(--editor-code-font-family)}
.presenter-content :where(.katex,.katex *){font-family:KaTeX_Main,Times New Roman,serif}
.presenter-content h1{font-size:44px;line-height:1.18;margin:0 0 22px}
.presenter-content h2{font-size:34px;line-height:1.25;margin:0 0 18px}
.presenter-content h3{font-size:28px;line-height:1.32;margin:0 0 14px}
.presenter-content h4{font-size:23px;line-height:1.4;margin:0 0 12px;font-weight:700}
.presenter-content p,.presenter-content div,.presenter-content blockquote,.presenter-content ul,.presenter-content ol,.presenter-content pre,.presenter-content table{margin-bottom:18px}
.presenter-content ul,.presenter-content ol{padding-left:1.5em}
.presenter-content li{margin:7px 0}
.presenter-content li>ul,.presenter-content li>ol{margin-top:7px;margin-bottom:7px}
.presenter-content blockquote{border-left:4px solid #94a3b8;padding:4px 0 4px 18px;color:#475569}
.presenter-content img{max-width:100%;border-radius:4px;margin:6px 0;vertical-align:bottom}
.presenter-content img.align-left{display:block;margin-right:auto;margin-bottom:6px;max-width:50%;float:none}
.presenter-content img.align-center{display:block;margin-left:auto;margin-right:auto;float:none;max-width:100%}
.presenter-content img.align-right{display:block;margin-left:auto;margin-bottom:6px;max-width:50%;float:none}
.presenter-content pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:22px;overflow:auto;font-size:16px}
.presenter-content code{font-size:.86em;background:rgba(99,102,241,.1);padding:.08em .28em;border-radius:4px}
.presenter-content pre code{background:none;padding:0;border-radius:0;white-space:pre}
.presenter-content table{border-collapse:collapse;width:100%;margin:8px 0}
.presenter-content td,.presenter-content th{border:1px solid #d0d0d0;padding:6px 10px;min-width:60px;font-size:inherit;outline:none}
.presenter-content th{background:#f7f7f7;font-weight:600}
.presenter-content .todo-item{display:flex;align-items:flex-start;gap:10px}
.presenter-content .todo-item input[type="checkbox"]{width:18px;height:18px;margin-top:8px;accent-color:#667eea}
.presenter-content .todo-item.checked .todo-text{text-decoration:line-through;color:#94a3b8}
.presenter-content .tex{background:#f8f8ff;padding:1px 4px;border-radius:3px;font-family:inherit}
.presenter-content .tex-display{display:block;text-align:center;margin:8px 0;padding:6px;background:#fafaff;border-radius:4px}
.presenter-empty{color:#94a3b8;text-align:center;font-size:18px}

.sidebar{width:var(--sidebar-w);flex-shrink:0;background:#f8f9fb;border-left:1px solid #dfe3ea;display:flex;flex-direction:column;overflow:hidden}
.cal-hd{padding:12px 14px;border-bottom:1px solid #dfe3ea;flex-shrink:0;background:#fff}
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-nav button{background:#fff;border:1px solid #cfd6e0;border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:14px;color:#374151;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:#eef2ff;border-color:#aeb8ca}
.cal-title{font-size:14px;font-weight:700;color:#1f2937}
.cal-body{flex:1;overflow-y:auto;min-height:0}
.cal-body.cal-anim>*{animation:calViewIn .18s ease-out both}
@keyframes calViewIn{from{opacity:.4;transform:translateY(6px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.cal-month{padding:8px 12px}
.cal-wk{display:grid;grid-template-columns:28px repeat(7,1fr);text-align:center;font-size:10px;color:#6b7280;margin-bottom:3px;font-weight:600}
.cal-week{display:grid;grid-template-columns:28px repeat(7,1fr);gap:1px}
.cal-days{display:grid;gap:1px}
.cal-week-no{display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px;color:#667eea;cursor:pointer;background:rgba(102,126,234,.08);font-weight:700}
.cal-week-no:hover{background:#dfe5ff}
.cal-d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;font-size:12px;cursor:pointer;position:relative;transition:background .12s;color:#374151}
.cal-d:hover{background:#e9ecff}
.cal-d.om{color:#b3bac6}
.cal-d.td{font-weight:700;color:#667eea}
.cal-d.sel{background:#667eea;color:#fff}
.cal-d.sel.td{color:#fff}
.cal-main{line-height:1;font-variant-numeric:tabular-nums}
.cal-sub{max-width:100%;margin-top:3px;padding:0 2px;font-size:9px;line-height:1.05;color:#8b95a5;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-sub.fest{color:#dc2626;font-weight:700}
.cal-d .dot{width:4px;height:4px;border-radius:50%;background:#667eea;position:absolute;bottom:2px;opacity:.45}
.cal-d .dot.i2{opacity:.62;width:5px;height:5px}
.cal-d .dot.i3{opacity:.78;width:6px;height:6px}
.cal-d .dot.i4{opacity:.95;width:7px;height:7px}
.cal-d .amt{position:absolute;right:3px;bottom:3px;font-size:8px;line-height:1;color:#8b95a5;font-variant-numeric:tabular-nums;font-weight:500}
.cal-d.sel .dot{background:#fff}
.cal-d.sel .amt{color:rgba(255,255,255,.78)}
.cal-d.sel .cal-sub{color:rgba(255,255,255,.78)}
.cal-d.sel .cal-sub.fest{color:#fff}
.cal-year{height:100%;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr) auto repeat(3,1fr);gap:6px 8px}
.year-half-line{grid-column:1/-1;height:1px;background:linear-gradient(90deg,transparent,rgba(148,163,184,.42),transparent)}
.mm{border:1px solid #dfe3ea;background:#fff;border-radius:6px;padding:5px;cursor:pointer;transition:border-color .15s,background .15s;min-height:0;overflow:hidden}
.mm:hover{border-color:#667eea}
.mm-t{font-size:11px;font-weight:600;text-align:center;margin-bottom:2px;color:#333}
.mm .cal-wk{grid-template-columns:16px repeat(7,1fr);font-size:7px}
.cal-year .mm .cal-wk{grid-template-columns:repeat(7,1fr)}
.cal-year .mm .cal-wk span:first-child{display:none}
.mm .cal-days{font-size:7px;gap:0}
.mm .cal-week{grid-template-columns:16px repeat(7,1fr);gap:0}
.mm .cal-week-no{font-size:7px;border-radius:2px}
.cal-year .mm .cal-week{grid-template-columns:repeat(7,1fr)}
.cal-year .mm .cal-week-no{display:none}
.mm .cal-d{border-radius:3px;font-size:7px}
.mm .cal-sub{display:none}
.mm .cal-d .dot{width:2px;height:2px;bottom:0}
.mm .cal-d .amt{display:none}
.dv{display:flex;flex-direction:column;height:100%;min-height:0}
.dv-hd{padding:10px 12px;text-align:center;font-size:14px;font-weight:700;color:#1f2937;border-bottom:1px solid #dfe3ea;background:#fff}
.dv-add{display:grid;grid-template-columns:62px 82px 1fr 44px;gap:6px;padding:8px;border-bottom:1px solid #e7eaf0;background:#fff}
.dv-add select,.dv-add input{height:28px;border:1px solid #d7dce5;border-radius:6px;background:#fff;padding:0 7px;font-size:12px;color:#334155;min-width:0}
.dv-add button{height:28px;border:1px solid #667eea;border-radius:6px;background:#667eea;color:#fff;font-size:12px;cursor:pointer}
.dv-tl{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:2px;min-height:0;background:#f3f5f9;padding-bottom:2px}
.dv-hr{display:flex;min-height:0;flex:1;background:#fff;box-shadow:inset 0 -1px 0 #e7eaf0}
.dv-lb{width:36px;flex-shrink:0;font-size:9px;color:#8b95a5;text-align:right;padding:3px 5px 0 0;border-right:1px solid #dfe3ea}
.dv-sl{flex:1;padding:3px 4px;min-height:28px}
.dv-sl:hover{background:#f8f8ff}
.cal-todo{position:absolute;left:40px;right:6px;min-height:18px;border-radius:6px;background:var(--todo-color,#ef4444);color:#fff;font-size:10px;line-height:1.25;box-shadow:0 4px 10px rgba(15,23,42,.12);overflow:hidden;z-index:3;cursor:grab;background-image:repeating-linear-gradient(180deg,transparent 0,transparent calc(100% / max(var(--todo-hours,1),1) - 1px),rgba(255,255,255,.45) calc(100% / max(var(--todo-hours,1),1) - 1px),rgba(255,255,255,.45) calc(100% / max(var(--todo-hours,1),1)))}
.cal-todo:active{cursor:grabbing}
.todo-in{display:flex;align-items:center;gap:4px;height:100%;padding:3px 4px}
.todo-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.todo-del{width:14px;height:14px;border:0;background:rgba(255,255,255,.24);border-radius:50%;color:#fff;line-height:14px;font-size:12px;cursor:pointer;flex-shrink:0}
.todo-resize{position:absolute;left:0;right:0;height:5px;cursor:ns-resize}
.todo-resize.top{top:0}
.todo-resize.bottom{bottom:0}
.dv-now{position:absolute;left:36px;right:0;height:2px;background:#e74c3c;z-index:2;pointer-events:none}
.dv-now::before{content:'';position:absolute;left:-3px;top:-2px;width:6px;height:6px;background:#e74c3c;border-radius:50%}
.wv{display:flex;flex-direction:column;height:100%;min-height:0}
.wv-hd{display:flex;border-bottom:1px solid #dfe3ea;flex-shrink:0;background:#fff}
.wv-gt{width:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#667eea}
.wv-dhs{display:flex;flex:1}
.wv-dh{flex:1;text-align:center;padding:6px 1px;font-size:10px;border-left:1px solid #e7eaf0;color:#4b5563}
.wv-dh .wn{display:block;font-size:14px;font-weight:600;margin-top:1px}
.wv-dh.td .wn{background:#667eea;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;margin:1px auto 0}
.wv-dh.sel{background:hsla(240, 67%, 43%, 0.329)}
.wv-bd{flex:1;overflow:hidden;display:flex;position:relative;min-height:0;background:#f3f5f9}
.wv-tc{width:36px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.wv-tl{flex:1;min-height:0;font-size:9px;color:#8b95a5;text-align:right;padding:1px 5px 0 0}
.wv-cols{display:flex;flex:1;gap:1px}
.wv-col{flex:1;border-left:1px solid #e7eaf0;display:flex;flex-direction:column;gap:2px;position:relative}
.wv-cl{flex:1;min-height:0;background:#fff;box-shadow:inset 0 -1px 0 #edf0f5;padding:1px 2px;overflow:hidden}
.wv-cl:hover{background:#f8f8ff}
.wv-col .cal-todo{left:4px;right:4px;min-height:4px;border-radius:4px;box-shadow:none;cursor:default}
.wv-col .cal-todo::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.18)}
.wv-col .todo-in,.wv-col .todo-resize{display:none}
.wv-now{position:absolute;left:36px;right:0;height:2px;background:#e74c3c;z-index:2;pointer-events:none}
.wv-now::before{content:'';position:absolute;left:-3px;top:-2px;width:6px;height:6px;background:#e74c3c;border-radius:50%}

.stor{border-top:1px solid #e8e8e8;padding:10px 14px;flex-shrink:0;background:#fafafa}
.stor-title{font-size:11px;color:#999;margin-bottom:6px;font-weight:600}
.stor-statuses{display:grid;gap:4px;margin-bottom:6px}
.stor-status{font-size:11px;color:#667eea;display:grid;grid-template-columns:6px 34px minmax(0,1fr);align-items:center;gap:6px;line-height:1.35}
.stor-status .dot-ok,.stor-status .dot-no,.stor-status .dot-wait{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.stor-status .dot-ok{background:#6c9}
.stor-status .dot-no{background:#ddd}
.stor-status .dot-wait{background:#f59e0b}
.stor-status .s-label{color:#9ca3af}
.stor-status .s-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stor-btns{display:flex;gap:4px;flex-wrap:wrap}
.stor-btns button{padding:4px 10px;border:1px solid #ddd;border-radius:5px;background:#fff;font-size:11px;cursor:pointer;color:#555;transition:all .15s}
.stor-btns button:hover{background:#f0f0ff;border-color:#667eea;color:#333}
.stor-btns button.primary{background:#667eea;color:#fff;border-color:#667eea}
.stor-btns button.primary:hover{opacity:.85}
.stor-hint{font-size:10px;color:#bbb;margin-top:6px;line-height:1.4}

.mount-gate{position:fixed;inset:0;z-index:900;background:rgba(248,250,252,.82);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:24px}
.mount-gate.hide{display:none}
.mount-panel{width:min(92vw,380px);background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:14px;box-shadow:0 24px 70px rgba(15,23,42,.16);padding:22px}
.mount-panel.merge-mode{width:min(96vw,1180px);max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
.mount-title{font-size:18px;font-weight:700;color:#111827;margin-bottom:8px}
.mount-copy{font-size:13px;line-height:1.7;color:#64748b;margin-bottom:16px}
.mount-file{font-size:12px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:14px;word-break:break-all}
.mount-actions{display:flex;gap:8px}
.mount-actions button{height:34px;padding:0 14px;border-radius:8px;border:1px solid #d7dce5;background:#fff;color:#334155;font-size:13px;cursor:pointer}
.mount-actions .primary{background:#667eea;border-color:#667eea;color:#fff;flex:1}
.mount-actions button:disabled{opacity:.55;cursor:default}
.mount-conflict{display:none;gap:8px;margin-top:8px}
.mount-conflict.show{display:flex}
.mount-conflict button{height:34px;padding:0 12px;border-radius:8px;border:1px solid #d7dce5;background:#fff;color:#334155;font-size:13px;cursor:pointer;flex:1}
.mount-conflict .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.merge-view{display:none;min-height:0;margin-top:12px}
.merge-view.show{display:block}
.merge-toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.merge-toolbar button{height:32px;padding:0 12px;border-radius:8px;border:1px solid #d7dce5;background:#fff;color:#334155;font-size:12px;cursor:pointer}
.merge-toolbar .primary{background:#667eea;border-color:#667eea;color:#fff}
.merge-grid{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;min-height:0;height:min(58vh,560px)}
.merge-col{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid #e2e8f0;border-radius:10px;background:#fff;overflow:hidden}
.merge-col h3{font-size:12px;color:#475569;padding:8px 10px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.merge-pane,.merge-editor{flex:1;min-height:0;overflow:auto;padding:10px;font-size:13px;line-height:1.65;color:#1f2937;word-break:break-word}
.merge-editor{outline:none;background:#fffdf7}
.merge-editor:focus{box-shadow:inset 0 0 0 2px rgba(102,126,234,.28)}
.merge-line{border-left:3px solid transparent;padding:4px 8px;margin:3px 0;border-radius:6px}
.merge-line.diff-del{border-left-color:#ef4444;background:#fef2f2}
.merge-line.diff-add{border-left-color:#22c55e;background:#f0fdf4}
.merge-line.same{opacity:.72}
.mount-msg{min-height:18px;margin-top:12px;font-size:12px;color:#64748b}
.mount-msg.err{color:#dc2626}
body.mounting .doc-wrap,body.mounting .sidebar{filter:blur(1px);pointer-events:none}
body.mounting .fbar{display:none}

.td-dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:999;align-items:center;justify-content:center}
.td-dlg.show{display:flex}
.td-dlg-in{background:#fff;border-radius:10px;padding:20px;width:260px}
.td-dlg-in h3{margin-bottom:12px;font-size:14px}
.td-dlg-in label{display:block;font-size:11px;color:#888;margin-bottom:2px}
.td-dlg-in input{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:5px;margin-bottom:8px;font-size:13px;outline:none}
.td-dlg-in input:focus{border-color:#667eea}
.td-dlg-b{display:flex;gap:6px;justify-content:flex-end}
.td-dlg-b button{padding:6px 14px;border-radius:5px;border:1px solid #ddd;font-size:12px;cursor:pointer}
.td-dlg-b .ok{background:#667eea;color:#fff;border-color:#667eea}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#d4d9e1;border-radius:2px}
.doc{scrollbar-width:thin;scrollbar-color:transparent transparent}
.doc::-webkit-scrollbar{width:3px}
.doc::-webkit-scrollbar-thumb{background:transparent;border-radius:3px}
.doc:hover::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22)}

  --dark-surface-3:#202b38;
  --dark-line:rgba(148,163,184,.18);

  --dark-text:#e6edf3;
  --dark-muted:#9aa8b6;
  --dark-faint:#5f6f82;
  --dark-accent:#8b9cff;
  --dark-accent-2:#2dd4bf;

<script>
const STORAGE_KEY='diary_doc',DATES_KEY='diary_edit_dates',STATS_KEY='diary_daily_stats',TODOS_KEY='diary_calendar_todos',META_KEY='diary_meta',HANDLE_NAME_KEY='diary_file_name',PENDING_SYNC_KEY='diary_pending_sync',CONFLICT_BACKUP_KEY='diary_conflict_backup';
const LOCAL_SAVE_DELAY=450;
const FILE_WRITE_DELAY=5000;
let calView='month',calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),calWeekStart=getMon(new Date()),selectedDate=null,saveTimer=null,localSaveTimer=null;
let texDisplay=false,fileHandle=null,selImg=null,fileWritable=false,fileWritePromise=Promise.resolve(),fileWritePending=false,syncReady=false;
let latestFileSnapshot=null,fileRetryTimer=null,mountConflict=null,localSaveErrorShown=false;
let pendingCharDelta=0,pendingDateMark=false;
let editorSavedRange=null;

const DARK_KEY='diary_dark';
function initDark(){
  if(localStorage.getItem(DARK_KEY)==='1')document.body.classList.add('dark');
  updateDarkBtn();
}
function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem(DARK_KEY,document.body.classList.contains('dark')?'1':'0');
  updateDarkBtn();
}
function updateDarkBtn(){
  const btn=document.getElementById('darkBtn');
  const dark=document.body.classList.contains('dark');
  btn.title=dark?'切换到日间模式':'切换到夜间模式';
  btn.setAttribute('aria-label',btn.title);
}
initDark();

const doc=document.getElementById('doc');
doc.innerHTML=localStorage.getItem(STORAGE_KEY)||'';
doc.setAttribute('contenteditable','false');
document.body.classList.add('mounting');
const docWrap=document.getElementById('docWrap');
let lastWritingLen=writingLength();
let gravityRaf=0,gravityMotion=0,gravityDir=1,gravityLast=0,gravityVelocity=0,gravityScrollRaf=0,gravityScrollLast=0;
const TYPOGRAPHY_STYLE_PROPS=['font','font-family','font-size','line-height'];
function normalizeEditorTypography(root=doc){
  if(!root)return false;
  const elements=[];
  if(root.nodeType===1)elements.push(root);
  elements.push(...root.querySelectorAll('*'));
  let changed=false;
  elements.forEach(el=>{
    if(el.closest&&el.closest('.katex'))return;
    if(el.hasAttribute('style')){
      const before=el.getAttribute('style')||'';
      TYPOGRAPHY_STYLE_PROPS.forEach(prop=>el.style.removeProperty(prop));
      const after=(el.getAttribute('style')||'').trim();
      if(after)el.setAttribute('style',after);
      else el.removeAttribute('style');
      if((el.getAttribute('style')||'')!==before)changed=true;
    }
    ['face','size'].forEach(attr=>{
      if(el.hasAttribute(attr)){el.removeAttribute(attr);changed=true}
    });
  });
  return changed;
}
function normalizeEditorHTML(html){
  const tpl=document.createElement('template');
  tpl.innerHTML=html||'';
  tpl.content.querySelectorAll('style,link,meta').forEach(el=>el.remove());
  normalizeEditorTypography(tpl.content);
  return tpl.innerHTML;
}
function plainTextFromHTML(html){
  const tpl=document.createElement('template');
  tpl.innerHTML=html||'';
  tpl.content.querySelectorAll('style,script,link,meta').forEach(el=>el.remove());
  return tpl.content.textContent||'';
}
function insertPlainEditorText(text){
  doc.focus();
  document.execCommand('insertText',false,text||'');
  normalizeEditorTypography(doc);
}
normalizeEditorTypography(doc);
function clamp01(n){return Math.max(0,Math.min(1,n))}
function setGravityVars(){
  const shift=gravityDir*gravityMotion*150;
  const shadow=gravityDir*gravityMotion*20;
  docWrap.style.setProperty('--gravity-motion',gravityMotion.toFixed(3));
  docWrap.style.setProperty('--gravity-shift',shift.toFixed(2)+'px');
  docWrap.style.setProperty('--gravity-shadow',shadow.toFixed(2)+'px');
  docWrap.style.setProperty('--gravity-blur',(gravityMotion*2.4).toFixed(2)+'px');
  docWrap.style.setProperty('--gravity-stretch',(1+gravityMotion*.032).toFixed(4));
}
function updateGravityUI(){
  gravityRaf=0;
  const max=Math.max(1,doc.scrollHeight-doc.clientHeight);
  const depth=clamp01(doc.scrollTop/max);
  docWrap.style.setProperty('--gravity-depth',depth.toFixed(4));
  setGravityVars();
}
function queueGravityUI(){
  if(!gravityRaf)gravityRaf=requestAnimationFrame(updateGravityUI);
}
function decayGravityMotion(now){
  if(!gravityLast)gravityLast=now;
  const dt=Math.min(48,now-gravityLast);
  gravityLast=now;
  gravityMotion*=Math.pow(.82,dt/16);
  if(gravityMotion<.015)gravityMotion=0;
  setGravityVars();
  if(gravityMotion>0)requestAnimationFrame(decayGravityMotion);
  else gravityLast=0;
}
function runGravityScroll(now){
  if(!gravityScrollLast)gravityScrollLast=now;
  const dt=Math.min(48,now-gravityScrollLast);
  gravityScrollLast=now;
  doc.scrollTop+=gravityVelocity*dt/16;
  gravityVelocity*=Math.pow(.91,dt/16);
  if(Math.abs(gravityVelocity)>0.18){
    gravityScrollRaf=requestAnimationFrame(runGravityScroll);
  }else{
    gravityVelocity=0;
    gravityScrollRaf=0;
    gravityScrollLast=0;
  }
}
function handleEditorWheel(e){
  if(e.ctrlKey)return;
  e.preventDefault();
  const abs=Math.min(1200,Math.abs(e.deltaY));
  const sign=e.deltaY>=0?1:-1;
  const normalized=abs/120;
  const nonlinear=abs*.22+Math.pow(normalized,2.35)*115;
  const impulse=clamp01(nonlinear/620);
  if(impulse<=0)return;
  gravityDir=sign;
  gravityVelocity+=sign*nonlinear*.18;
  gravityVelocity=Math.max(-170,Math.min(170,gravityVelocity));
  gravityMotion=clamp01(gravityMotion+impulse*1.25);
  setGravityVars();
  if(!gravityLast)requestAnimationFrame(decayGravityMotion);
  if(!gravityScrollRaf)gravityScrollRaf=requestAnimationFrame(runGravityScroll);
}
docWrap.addEventListener('wheel',handleEditorWheel,{passive:false});
doc.addEventListener('scroll',queueGravityUI,{passive:true});
window.addEventListener('resize',queueGravityUI);
queueGravityUI();

// ===== Undo / Redo =====
const MAX_UNDO=80;
let undoStack=[],redoStack=[],undoPaused=false;
function captureSnapshot(){return doc.innerHTML}
function pushUndo(){
  if(undoPaused)return;
  const snap=captureSnapshot();
  if(undoStack.length>0&&undoStack[undoStack.length-1]===snap)return;
  undoStack.push(snap);
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  redoStack=[];
  updateUndoRedoBtns();
}
function doUndo(){
  if(undoStack.length<=1)return;
  undoPaused=true;
  redoStack.push(undoStack.pop());
  doc.innerHTML=undoStack[undoStack.length-1];
  resetWritingBaseline();
  renderAllContent();
  undoPaused=false;
  save();updateUndoRedoBtns();
}
function doRedo(){
  if(!redoStack.length)return;
  undoPaused=true;
  const snap=redoStack.pop();
  undoStack.push(snap);
  doc.innerHTML=snap;
  resetWritingBaseline();
  renderAllContent();
  undoPaused=false;
  save();updateUndoRedoBtns();
}
function updateUndoRedoBtns(){
  document.getElementById('undoBtn').disabled=undoStack.length<=1;
  document.getElementById('redoBtn').disabled=redoStack.length===0;
}
// Capture initial state
pushUndo();
// Push snapshot on input and after save-triggering actions
doc.addEventListener('input',()=>{clearTimeout(undoTimer);undoTimer=setTimeout(pushUndo,400)});
let undoTimer=null;
// Keyboard shortcuts
doc.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();doRedo();return}
});

initStartupMount();

const CODE_LANGS=[
  ['plaintext','Text'],['python','Python'],['javascript','JavaScript'],['typescript','TypeScript'],
  ['java','Java'],['cpp','C++'],['csharp','C#'],['go','Go'],['rust','Rust'],['bash','Bash'],
  ['sql','SQL'],['json','JSON'],['yaml','YAML'],['xml','XML'],['html','HTML'],['css','CSS'],['markdown','Markdown']
];
function normalizeCodeLang(lang){
  const key=String(lang||'plaintext').toLowerCase().replace(/^language-/,'');
  const aliases={plain:'plaintext',text:'plaintext',txt:'plaintext',js:'javascript',ts:'typescript',sh:'bash',shell:'bash',c:'cpp','c++':'cpp','c#':'csharp',md:'markdown'};
  const val=aliases[key]||key;
  return CODE_LANGS.some(([id])=>id===val)?val:'plaintext';
}
function codeLangOptions(active){
  const lang=normalizeCodeLang(active);
  return CODE_LANGS.map(([id,label])=>'<option value="'+id+'"'+(id===lang?' selected':'')+'>'+label+'</option>').join('');
}
function createCodeBlock(lang){
  const active=normalizeCodeLang(lang);
  const pre=document.createElement('pre');
  const code=document.createElement('code');
  code.className='language-'+active;
  code.setAttribute('contenteditable','true');
  code.setAttribute('spellcheck','false');
  code.appendChild(document.createElement('br'));
  pre.appendChild(code);
  const sel=document.createElement('select');
  sel.className='code-lang';
  sel.setAttribute('contenteditable','false');
  sel.innerHTML=codeLangOptions(active);
  pre.appendChild(sel);
  const dots=document.createElement('span');
  dots.className='code-dots';
  dots.setAttribute('contenteditable','false');
  dots.textContent='···';
  pre.appendChild(dots);
  return pre;
}
function getCodeLang(code){

function placeCursorInCode(code,offset){
  code.focus();
  const sel=window.getSelection();
  const range=document.createRange();
  if(!code.textContent){
    range.setStart(code,0);
  }else{
    const walker=document.createTreeWalker(code,NodeFilter.SHOW_TEXT,null);
    let pos=0,placed=false;
    while(walker.nextNode()){
      const node=walker.currentNode;
      if(pos+node.length>=offset){
        range.setStart(node,Math.max(0,offset-pos));
        placed=true;
        break;
      }
      pos+=node.length;
    }
    if(!placed)range.selectNodeContents(code);
  }
  range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
function rehighlightCode(code,keepCursor){

  const preRange=document.createRange();
  preRange.selectNodeContents(code);
  preRange.setEnd(range.startContainer,range.startOffset);
  return preRange.toString().length;
}

function snapshotsDiffer(a,b){

function decideMountSnapshot(local,remote){
  const lt=snapshotTime(local),rt=snapshotTime(remote);
  const localHas=snapshotHasContent(local),remoteHas=snapshotHasContent(remote);
  const pending=hasPendingSync()&&localHas;
  if(!localHas)return {action:'remote'};
  if(!remoteHas)return {action:'local'};
  if(!snapshotsDiffer(local,remote))return {action:'remote'};
  if(pending&&(!lt||!rt||rt>=lt))return {action:'conflict'};
  if(!lt||!rt||lt===rt)return {action:'conflict'};
  if(lt&&rt&&lt>rt)return {action:'local'};
  if(lt&&!rt)return {action:'local'};
  return {action:'remote'};
}

const TODO_CATEGORIES={
  Familiy:{label:'Familiy',color:'#ef4444'},

function normalizeTodos(raw){
  const out={};
  Object.keys(raw||{}).forEach(date=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Array.isArray(raw[date]))return;
    const items=raw[date].map(item=>{
      const hour=Math.max(0,Math.min(23,parseInt(item&&item.hour,10)||0));
      const rawStart=item&&item.start!=null?item.start:hour*60;
      const start=Math.max(0,Math.min(1425,Math.round((+rawStart||0)/15)*15));
      const duration=Math.max(15,Math.min(1440-start,Math.round((+(item&&item.duration)||30)/15)*15));
      const rawCategory=item&&item.category==='Family'?'Familiy':item&&item.category;
      const category=TODO_CATEGORIES[rawCategory]?rawCategory:'Familiy';
      const text=String(item&&item.text||'').trim();
      if(!text)return null;
      return {
        id:String(item.id||Date.now()+Math.random()),
        hour:Math.floor(start/60),
        start,
        duration,
        category,
        text
      };
    }).filter(Boolean);
    if(items.length)out[date]=items;
  });
  return out;
}

// ===== Auto-render: LaTeX + Inline Markdown + Block Shortcuts =====
function autoRenderCheck(){
  const s=window.getSelection();
  if(!s.rangeCount)return;
  let n=s.anchorNode;
  if(!n)return;

  // If inside a code block, skip
  if(n.nodeType===1&&n.closest&&n.closest('pre'))return;
  if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('pre'))return;

  // Get the text node
  if(n.nodeType!==3)return;

  const t=n.textContent;
  const off=s.anchorOffset;
  if(off<=0)return;
  const before=t.substring(0,off);

  // === Block-level shortcuts ===
  // Skip inline rendering if this looks like a code block fence in progress
  if(/```/.test(before))return;

  // Heading: # ~ ######
  const hm=before.match(/^(#{1,6})\s+$/);
  if(hm){const rest=n.textContent.substring(hm[0].length);n.textContent=rest||'​';document.execCommand('formatBlock',false,'h'+hm[1].length);return}

  // Todo: - [ ] or - [x] (must check before unordered list)
  const tm=before.match(/^- \[([ xX])\]\s+$/);
  if(tm){const checked=tm[1]!==' ';
    n.textContent='';
    const html='<div class="todo-item'+(checked?' checked':'')+'"><input type="checkbox"'+(checked?' checked':'')+'><span class="todo-text"><br></span></div>';
    document.execCommand('insertHTML',false,html);return;
  }

  // Todo inside list item: after "- " triggers UL, user types "[ ] " inside <li>
  const li=n.parentNode&&n.parentNode.closest?n.parentNode.closest('li'):null;
  if(li){
    const tm2=before.match(/^\[([ xX])\]\s+$/);
    if(tm2){const checked=tm2[1]!==' ';
      li.remove();
      const html='<div class="todo-item'+(checked?' checked':'')+'"><input type="checkbox"'+(checked?' checked':'')+'><span class="todo-text"><br></span></div>';
      document.execCommand('insertHTML',false,html);return;
    }
  }

  // Unordered list: - or * (alone on line)
  if(/^[-*]\s+$/.test(before)){insertList('ul',{markerNode:n,markerLength:before.length});return}

  // Ordered list: 1. (alone on line)
  if(/^\d+\.\s+$/.test(before)){insertList('ol',{markerNode:n,markerLength:before.length});return}

  // Blockquote: >
  if(/^>\s+$/.test(before)){const rest=n.textContent.substring(before.length);n.textContent=rest||'​';document.execCommand('formatBlock',false,'blockquote');return}

  // === Inline rendering ===
  // 1. Display math: $$...$$
  const dmIdx=before.lastIndexOf('$$');
  if(dmIdx>0){
    const openIdx=before.lastIndexOf('$$',dmIdx-1);
    if(openIdx>=0&&openIdx<dmIdx-1){
      const latex=before.substring(openIdx+2,dmIdx);
      const trailing=before.substring(dmIdx+2);
      if(latex.length>0&&!latex.includes('$$')&&trailing.trim()===''){
        doRenderLatex(n,openIdx,dmIdx+2,latex,true);
        return;
      }
    }
  }

  // 2. Inline math: $...$
  if(before.endsWith('$')&&before.length>1){
    let closeIdx=before.length-1;
    if(closeIdx>0&&before[closeIdx-1]==='$')return;
    let openIdx=-1;
    for(let i=closeIdx-1;i>=0;i--){
      if(before[i]==='$'){
        if(i>0&&before[i-1]==='$')continue;
        if(i+1<=closeIdx&&before[i+1]==='$')continue;
        openIdx=i;break;
      }
    }
    if(openIdx>=0&&closeIdx>openIdx+1){
      if(openIdx>0&&before[openIdx-1]==='$')return;
      const latex=before.substring(openIdx+1,closeIdx);
      if(latex.length>0&&!latex.includes('$')){
        doRenderLatex(n,openIdx,off,latex,false);
        return;
      }
    }
  }

  // 3. Inline code: `...`
  const cm=before.match(/`([^`]+)`$/);
  if(cm){const start=off-cm[0].length;doReplaceInline(n,start,off,cm[1],'code');return}

  // 4. Bold: **...**
  const bm=before.match(/\*\*([^*]+)\*\*$/);
  if(bm){const start=off-bm[0].length;doReplaceInline(n,start,off,bm[1],'b');return}

  // 5. Italic: *...* (not **)
  const im=before.match(/(?:^|[^*])\*([^*]+)\*$/);
  if(im){
    let openPos=-1;
    for(let i=before.length-2;i>=0;i--){
      if(before[i]==='*'&&(i===0||before[i-1]!=='*')&&(before[i+1]!=='*')){
        openPos=i;break;
      }
    }
    if(openPos>=0){
      const txt=before.substring(openPos+1,before.length-1);
      if(txt.length>0&&!txt.includes('*')){
        doReplaceInline(n,openPos,off,txt,'i');return;
      }
    }
  }
}

function doRenderLatex(node,start,end,latex,display){
  const before=node.textContent.substring(0,start);
  const after=node.textContent.substring(end);
  const parent=node.parentNode;
  if(!parent)return;

  const bf=document.createTextNode(before);
  const af=document.createTextNode(after||'​');
  const el=document.createElement('span');
  el.className=display?'tex-display':'tex';
  el.setAttribute('data-tex',latex);
  el.setAttribute('contenteditable','false');

  parent.insertBefore(bf,node);
  parent.insertBefore(el,node);
  parent.insertBefore(af,node);
  parent.removeChild(node);

  if(typeof katex!=='undefined'){
    try{katex.render(latex,el,{throwOnError:false,displayMode:display})}catch(e){el.textContent=latex}
  }

  // Cursor into the after-text node so user can keep typing / press Enter
  const sel=window.getSelection();const range=document.createRange();
  range.setStart(af,after?after.length:1);range.collapse(true);sel.removeAllRanges();sel.addRange(range);
  pushUndo();save();
}

function doReplaceInline(node,start,end,text,tag){
  const before=node.textContent.substring(0,start);
  const after=node.textContent.substring(end);
  const parent=node.parentNode;
  if(!parent)return;

  const bf=document.createTextNode(before);
  const af=document.createTextNode(after||'​');
  const el=document.createElement(tag);
  el.textContent=text;

  parent.insertBefore(bf,node);
  parent.insertBefore(el,node);
  parent.insertBefore(af,node);
  parent.removeChild(node);

  const sel=window.getSelection();const range=document.createRange();
  range.setStart(af,after?after.length:1);range.collapse(true);sel.removeAllRanges();sel.addRange(range);
  pushUndo();save();
}

function shouldSkipMarkdownLinkNode(node){
  const el=node.nodeType===3?node.parentElement:node;
  return !el||!doc.contains(el)||(el.closest&&el.closest('pre,a,.tex,.tex-display'));
}

function normalizeLinkHref(raw){
  const href=(raw||'').trim();
  if(!href||/[\u0000-\u001f\u007f\s]/.test(href))return '';
  const lower=href.toLowerCase();
  if(/^(javascript|data|vbscript):/.test(lower))return '';
  if(/^(https?:|mailto:|tel:)/i.test(href))return href;
  if(/^(#|\/|\.\/|\.\.\/)/.test(href))return href;
  return 'https://'+href;
}

function doRenderLink(node,start,end,text,href,rawHref){
  const before=node.textContent.substring(0,start);
  const after=node.textContent.substring(end);
  const parent=node.parentNode;
  if(!parent)return;

  const bf=document.createTextNode(before);
  const af=document.createTextNode(after||'\u200b');
  const el=document.createElement('a');
  el.textContent=text;
  el.setAttribute('href',href);
  el.target='_blank';
  el.rel='noopener noreferrer';
  el.title=rawHref||href;

  parent.insertBefore(bf,node);
  parent.insertBefore(el,node);
  parent.insertBefore(af,node);
  parent.removeChild(node);

  const sel=window.getSelection();const range=document.createRange();
  range.setStart(af,after?after.length:1);range.collapse(true);sel.removeAllRanges();sel.addRange(range);
  pushUndo();save();
}

function renderPendingMarkdownLink(e){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||!sel.isCollapsed)return false;
  const node=sel.anchorNode;
  if(!node||node.nodeType!==3||shouldSkipMarkdownLinkNode(node))return false;
  const off=sel.anchorOffset;
  const before=node.textContent.substring(0,off);
  const match=before.match(/(?:^|[^!])\[([^\]\n]+)\]\(([^)\s]+)\)$/);
  if(!match)return false;
  const href=normalizeLinkHref(match[2]);
  if(!href)return false;
  const start=off-match[0].length+(match[0][0]==='['?0:1);
  e.preventDefault();
  doRenderLink(node,start,off,match[1],href,match[2]);
  if(e.key===' '){
    document.execCommand('insertText',false,' ');
  }else if(e.key==='Enter'){
    document.execCommand('insertParagraph',false,null);
  }
  return true;
}

// ===== Markdown shortcuts =====

function getCursorBlock(){
  const s=window.getSelection();if(!s.rangeCount)return null;
  let n=s.anchorNode;
  while(n&&n!==doc){
    if(n.nodeType===1&&['P','DIV','H1','H2','H3','H4','LI','BLOCKQUOTE'].includes(n.nodeName))return n;
    n=n.parentNode;
  }
  return null;
}

function setCursorInText(el,offset){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  let pos=0,last=null;
  while(walker.nextNode()){
    const node=walker.currentNode;
    last=node;
    const next=pos+node.length;
    if(next>=offset){
      const range=document.createRange();
      range.setStart(node,Math.max(0,offset-pos));
      range.collapse(true);
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
      return;
    }
    pos=next;
  }
  const range=document.createRange();
  if(last)range.setStart(last,last.length);
  else range.setStart(el,0);
  range.collapse(true);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
}

function textOffsetInElement(el,node,offset){
  const range=document.createRange();
  range.selectNodeContents(el);
  try{range.setEnd(node,offset)}catch(e){return el.textContent.length}
  return range.toString().length;
}

function ensureEditableLine(){
  const p=document.createElement('p');
  p.appendChild(document.createElement('br'));
  doc.appendChild(p);
  const range=document.createRange();
  range.setStart(p,0);range.collapse(true);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  return p;
}

function unwrapListItem(li){
  const list=li.parentNode;
  const p=document.createElement('p');
  while(li.firstChild)p.appendChild(li.firstChild);
  if(!p.childNodes.length)p.appendChild(document.createElement('br'));
  list.parentNode.insertBefore(p,list);
  li.remove();
  if(!list.children.length)list.remove();
  setCursorInText(p,p.textContent.length);
  save();
}

function insertList(kind,opts){
  doc.focus();
  const tag=kind==='ol'?'ol':'ul';
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  let block=getCursorBlock();
  if(!block)block=ensureEditableLine();

  if(block.nodeName==='LI'){
    if(block.parentNode&&block.parentNode.nodeName.toLowerCase()===tag)unwrapListItem(block);
    else document.execCommand(tag==='ol'?'insertOrderedList':'insertUnorderedList');
    return;
  }

  const anchor=sel.anchorNode;
  const anchorOffset=sel.anchorOffset;
  const markerNode=opts&&opts.markerNode;
  const markerLength=opts&&opts.markerLength||0;
  let cursorOffset=0;
  if(markerNode&&block.contains(markerNode)){
    const start=textOffsetInElement(block,markerNode,0);
    const before=markerNode.textContent.slice(0,markerLength);
    const after=markerNode.textContent.slice(markerLength);
    markerNode.textContent=after;
    cursorOffset=start;
  }else if(block.contains(anchor)){
    cursorOffset=textOffsetInElement(block,anchor,anchorOffset);
  }

  const list=document.createElement(tag);
  const li=document.createElement('li');
  while(block.firstChild)li.appendChild(block.firstChild);
  if(!li.textContent.trim()&&!li.querySelector('img,table,pre,.tex,.tex-display'))li.innerHTML='<br>';
  list.appendChild(li);
  block.replaceWith(list);
  setCursorInText(li,cursorOffset);
  pushUndo();save();
}

function getCursorCode(){
  const s=window.getSelection();if(!s.rangeCount)return null;
  let n=s.anchorNode;
  if(!n)return null;
  if(n.nodeType===3)n=n.parentElement;
  return n&&n.closest?n.closest('pre code'):null;
}

function getTextOffsetInCode(code,node,offset){
  const range=document.createRange();
  range.selectNodeContents(code);
  range.setEnd(node,offset);
  return range.toString().length;
}

function getSelectionOffsetsInCode(code){
  const s=window.getSelection();if(!s.rangeCount)return null;
  if(!code.contains(s.anchorNode)||!code.contains(s.focusNode))return null;
  const a=getTextOffsetInCode(code,s.anchorNode,s.anchorOffset);
  const f=getTextOffsetInCode(code,s.focusNode,s.focusOffset);
  return {start:Math.min(a,f),end:Math.max(a,f),backward:a>f};
}

function getCodePointAtOffset(code,offset){
  const walker=document.createTreeWalker(code,NodeFilter.SHOW_TEXT,null);
  let pos=0,last=null;
  while(walker.nextNode()){
    const node=walker.currentNode;
    last=node;
    if(pos+node.length>=offset)return {node,offset:Math.max(0,offset-pos)};
    pos+=node.length;
  }
  if(last)return {node:last,offset:last.length};
  return {node:code,offset:0};
}

function selectRangeInCode(code,start,end,backward){
  code.focus();
  const sel=window.getSelection();
  const range=document.createRange();
  const a=getCodePointAtOffset(code,start);
  const b=getCodePointAtOffset(code,end);
  range.setStart(a.node,a.offset);
  range.setEnd(b.node,b.offset);
  sel.removeAllRanges();
  if(backward&&sel.extend){
    const endRange=document.createRange();
    endRange.setStart(b.node,b.offset);
    endRange.collapse(true);
    sel.addRange(endRange);
    sel.extend(a.node,a.offset);
  }else{
    sel.addRange(range);
  }
}

function handleMdEnter(e){
  // Code block: ``` or ```python — triggered by Enter
  const s=window.getSelection();if(s.rangeCount){
    const n=s.anchorNode;
    if(n&&n.nodeType===3){
      const t=n.textContent;const off=s.anchorOffset;
      const before=t.substring(0,off);
      const clm=before.match(/^```(\w+)$/);
      if(clm||/^```$/.test(before)){
        e.preventDefault();
        const block=getCursorBlock();
        const lang=clm?clm[1]:'plaintext';
        const pre=createCodeBlock(lang);
        const code=pre.querySelector('code');
        if(block){block.replaceWith(pre);}else{n.textContent='';doc.insertBefore(pre,null);}
        const p=document.createElement('p');p.appendChild(document.createElement('br'));
        pre.after(p);
        placeCursorInCode(code,0);
        pushUndo();save();return;
      }
    }
  }

  const blk=getCursorBlock();if(!blk)return;
  // Empty list item → exit list
  if(blk.nodeName==='LI'&&blk.textContent.trim()===''){
    e.preventDefault();document.execCommand('outdent');
    const blk2=getCursorBlock();
    if(blk2&&blk2.nodeName==='LI')document.execCommand('formatBlock',false,'p');
    return;
  }
  // Continue todo
  if(blk.classList&&blk.classList.contains('todo-item')){
    e.preventDefault();
    // Empty todo → exit todo mode
    if(blk.textContent.trim()===''){
      const p=document.createElement('p');p.innerHTML='<br>';
      blk.after(p);blk.remove();
      const range=document.createRange();range.setStart(p,0);range.collapse(true);
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
      pushUndo();save();return;
    }
    const newItem=document.createElement('div');
    newItem.className='todo-item';
    newItem.innerHTML='<input type="checkbox"><span class="todo-text"><br></span>';
    blk.after(newItem);
    // Move cursor into new todo text
    const textSpan=newItem.querySelector('.todo-text');
    const range=document.createRange();
    range.setStart(textSpan,0);range.collapse(true);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
    pushUndo();save();
  }
}

function handleTab(e){
  const code=getCursorCode();
  if(code){
    e.preventDefault();
    e.shiftKey?outdentCodeSelection(code):indentCodeSelection(code);
    showSt('saving');clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{save();showSt('saved')},FILE_WRITE_DELAY);
    return;
  }
  const blk=getCursorBlock();if(!blk)return;
  if(blk.nodeName==='LI'){e.preventDefault();e.shiftKey?document.execCommand('outdent'):document.execCommand('indent')}
}

function handleCodeEnter(e){
  const code=getCursorCode();
  if(!code)return false;
  const sel=getSelectionOffsetsInCode(code);
  if(!sel)return false;
  e.preventDefault();
  const text=code.textContent||'';
  const lineStart=text.lastIndexOf('\n',Math.max(0,sel.start-1))+1;
  const linePrefix=text.slice(lineStart,sel.start);
  const indent=(linePrefix.match(/^[\t ]*/)||[''])[0];
  const insert='\n'+indent;
  code.textContent=text.slice(0,sel.start)+insert+text.slice(sel.end);
  rehighlightCode(code,false);
  selectRangeInCode(code,sel.start+insert.length,sel.start+insert.length,false);
  showSt('saving');clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{save();showSt('saved')},FILE_WRITE_DELAY);
  return true;
}

function indentCodeSelection(code){
  const sel=getSelectionOffsetsInCode(code);if(!sel)return;
  const tab='    ';
  const text=code.textContent||'';
  if(sel.start===sel.end){
    const next=text.slice(0,sel.start)+tab+text.slice(sel.end);
    code.textContent=next;
    rehighlightCode(code,false);
    selectRangeInCode(code,sel.start+tab.length,sel.start+tab.length,false);
    return;
  }
  const lineStart=text.lastIndexOf('\n',Math.max(0,sel.start-1))+1;
  const lineEnd=sel.end>sel.start&&text[sel.end-1]==='\n'?sel.end-1:sel.end;
  const before=text.slice(0,lineStart);
  const target=text.slice(lineStart,lineEnd);
  const after=text.slice(lineEnd);
  const lineCount=target.split('\n').length;
  const next=before+target.replace(/^/gm,tab)+after;
  code.textContent=next;
  rehighlightCode(code,false);
  selectRangeInCode(code,sel.start+tab.length,sel.end+lineCount*tab.length,sel.backward);
}

function outdentCodeSelection(code){
  const sel=getSelectionOffsetsInCode(code);if(!sel)return;
  const text=code.textContent||'';
  const lineStart=text.lastIndexOf('\n',Math.max(0,sel.start-1))+1;
  const lineEnd=sel.end>sel.start&&text[sel.end-1]==='\n'?sel.end-1:sel.end;
  const before=text.slice(0,lineStart);
  const target=text.slice(lineStart,lineEnd);
  const after=text.slice(lineEnd);
  let removedBeforeStart=0,removedTotal=0,pos=lineStart;
  const nextTarget=target.split('\n').map(line=>{
    let rm=0;
    if(line.startsWith('\t'))rm=1;
    else if(line.startsWith('    '))rm=4;
    else if(line.startsWith('  '))rm=2;
    else if(line.startsWith(' '))rm=1;
    if(pos<sel.start)removedBeforeStart+=Math.min(rm,sel.start-pos);
    removedTotal+=rm;
    pos+=line.length+1;
    return line.slice(rm);
  }).join('\n');
  code.textContent=before+nextTarget+after;
  rehighlightCode(code,false);
  const nextStart=Math.max(lineStart,sel.start-removedBeforeStart);
  const nextEnd=Math.max(nextStart,sel.end-removedTotal);
  selectRangeInCode(code,nextStart,nextEnd,sel.backward);
}

  const link=e.target.closest&&e.target.closest('a[href]');

function getCursorTd(){const s=window.getSelection();if(!s.rangeCount)return null;let n=s.anchorNode;while(n&&n!==doc){if(n.tagName==='TD'||n.tagName==='TH')return n;n=n.parentNode}return null}
function tblAddRow(pos){
  const td=getCursorTd();if(!td)return;const tr=td.parentNode;const tbl=tr.parentNode;
  const newRow=document.createElement('tr');
  for(let i=0;i<tr.children.length;i++){const c=document.createElement(tr.children[i].tagName);c.innerHTML='<br>';newRow.appendChild(c)}
  if(pos==='before')tbl.insertBefore(newRow,tr);else tr.parentNode.insertBefore(newRow,tr.nextSibling);
  save();
}
function tblAddCol(pos){
  const td=getCursorTd();if(!td)return;const tbl=td.closest('table');
  if(!tbl)return;
  const idx=td.cellIndex;
  Array.from(tbl.rows).forEach(row=>{
    const cells=Array.from(row.cells);
    const ref=cells[Math.min(idx,cells.length-1)];
    const c=document.createElement(row.parentElement&&row.parentElement.tagName==='THEAD'?'th':'td');
    c.innerHTML='<br>';
    if(!ref)row.appendChild(c);
    else if(pos==='before')row.insertBefore(c,ref);
    else row.insertBefore(c,ref.nextSibling);
  });
  save();
}
function tblDelRow(){const td=getCursorTd();if(!td)return;const tr=td.parentNode;if(tr.parentNode.rows.length>1)tr.remove();save()}
function tblDelCol(){
  const td=getCursorTd();if(!td)return;const tbl=td.closest('table');
  if(!tbl)return;
  const idx=td.cellIndex;
  const rows=Array.from(tbl.rows);
  const maxCols=Math.max(...rows.map(row=>row.cells.length));
  if(maxCols<=1)return;
  rows.forEach(row=>{if(row.cells[idx])row.cells[idx].remove()});
  save();
}
function tblDelTable(){const td=getCursorTd();if(!td)return;const tbl=td.closest('table');if(tbl)tbl.remove();hideCtxBars();save()}

function rememberEditorSelection(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  const node=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentNode;
  if(node&&doc.contains(node))editorSavedRange=range.cloneRange();
}
function restoreEditorSelection(){
  if(editorSavedRange){
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(editorSavedRange.cloneRange());
  }
  doc.focus();
}
function getDocSelectionRange(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed)return null;
  const range=sel.getRangeAt(0);
  const start=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentNode;
  const end=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentNode;
  if(!doc.contains(start)||!doc.contains(end))return null;
  return range;
}
function updatePresentBtn(){

  const presenter=document.getElementById('presenter');
  const content=document.getElementById('presenterContent');
  const frag=range.cloneContents();
  content.innerHTML='';
  if(!frag.textContent.trim()&&!frag.querySelector('img,table,pre,.tex,.tex-display')){
    content.innerHTML='<div class="presenter-empty">选区没有可展示的内容</div>';
  }else{
    content.appendChild(frag);

  }
  closeColorPickers();hideCtxBars();

function fileToEditorImage(f){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(r.error);
    r.onload=ev=>{
      const data=ev.target.result;
      if(!/^data:image\//.test(data)||/^data:image\/gif/i.test(data)||data.length<900000){resolve(data);return}
      const img=new Image();
      img.onload=()=>{
        const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.86));
      };
      img.onerror=()=>resolve(data);
      img.src=data;
    };
    r.readAsDataURL(f);
  });
}

function htmlBlocks(html){

  const nodes=Array.from(tpl.content.childNodes).filter(n=>n.nodeType!==3||n.textContent.trim());
  if(!nodes.length)return [];

  });

function matchedBlockIndexes(base,other){
  const m=base.length,n=other.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=base[i].text&&base[i].text===other[j].text?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const matched=new Set();
  let i=0,j=0;
  while(i<m&&j<n){
    if(base[i].text&&base[i].text===other[j].text){matched.add(i);i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1])i++;
    else j++;
  }
  return matched;
}
function diffPaneHTML(baseHtml,otherHtml,side){
  const base=htmlBlocks(baseHtml),other=htmlBlocks(otherHtml),matched=matchedBlockIndexes(base,other);
  if(!base.length)return '<div class="merge-line diff-'+(side==='local'?'del':'add')+'">空</div>';
  return base.map((block,i)=>{
    const cls=matched.has(i)?'same':(side==='local'?'diff-del':'diff-add');
    return '<div class="merge-line '+cls+'">'+block.html+'</div>';
  }).join('');
}

function mergeStats(a,b){

  Array.from(new Set([...Object.keys(as),...Object.keys(bs)])).forEach(k=>out[k]=Math.max(as[k]||0,bs[k]||0));
  return out;
}
function mergeTodos(a,b){
  const out={},as=normalizeTodos(a&&a.todos),bs=normalizeTodos(b&&b.todos);
  Array.from(new Set([...Object.keys(as),...Object.keys(bs)])).forEach(date=>{
    const byId=new Map();
    [...(as[date]||[]),...(bs[date]||[])].forEach(item=>byId.set(item.id,item));
    out[date]=Array.from(byId.values());
  });
  return out;
}

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('diaryDB',1);
    const timer=setTimeout(()=>rej(new Error('IndexedDB open timeout')),1800);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('handles'))req.result.createObjectStore('handles')};
    req.onsuccess=()=>{clearTimeout(timer);res(req.result)};
    req.onerror=()=>{clearTimeout(timer);rej(req.error)};
    req.onblocked=()=>{clearTimeout(timer);rej(new Error('IndexedDB blocked'))};
  })
}
function idbGet(db,key){
  return new Promise((res,rej)=>{
    const tx=db.transaction('handles','readonly');
    const req=tx.objectStore('handles').get(key);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
    tx.onerror=()=>rej(tx.error);
  });
}
function idbPut(db,key,value){
  return new Promise((res,rej)=>{
    const tx=db.transaction('handles','readwrite');
    tx.objectStore('handles').put(value,key);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
    tx.onabort=()=>rej(tx.error);
  });
}
