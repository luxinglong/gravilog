<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/plaintext.min.js"></script>

</head>
<body>

  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 8h5V3"/><path d="M20 8c-2.2-2.7-5.1-4-8.3-3.6C7.4 4.9 4 8.5 4 13c0 4.7 3.8 8.5 8.5 8.5 2.4 0 4.6-1 6.1-2.6"/></symbol>
  <symbol id="i-ul" viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4.5 6h.01"/><path d="M4.5 12h.01"/><path d="M4.5 18h.01"/></symbol>
  <symbol id="i-ol" viewBox="0 0 24 24"><path d="M10 6h10"/><path d="M10 12h10"/><path d="M10 18h10"/><path d="M4 5h1v4"/><path d="M4 9h2"/><path d="M4 12h2l-2 3h2"/><path d="M4 19h2"/><path d="M5.8 18v4"/></symbol>
  <symbol id="i-quote" viewBox="0 0 24 24"><path d="M9 8H5.8c-.5 0-.8.3-.8.8V12h4v5H4.5C4 17 4 16.7 4 16.3V12c0-3 1.4-5 4.4-6"/><path d="M20 8h-3.2c-.5 0-.8.3-.8.8V12h4v5h-4.5c-.5 0-.5-.3-.5-.7V12c0-3 1.4-5 4.4-6"/></symbol>

  <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m4 16 4.2-4.2a1.6 1.6 0 0 1 2.3 0L15 16"/><path d="m13 14 1.2-1.2a1.6 1.6 0 0 1 2.3 0L20 16.3"/><circle cx="16.5" cy="9" r="1.2"/></symbol>

</svg>
<button class="cal-trigger" id="calTrigger" data-action="toggle-calendar" aria-label="打开日历" title="打开日历">
  <svg><use href="#i-calendar"></use></svg><span class="mini-date" id="miniDate"></span>
</button>
<div class="main">
  <div class="doc-wrap" id="docWrap">
    <div class="doc gravity-flow" id="doc" contenteditable="true"></div>
  </div>
  <div class="sidebar" id="calendarPanel">
    <div class="cal-hd">
      <div class="cal-nav">
        <button data-action="calendar-prev">&#8249;</button>
        <span class="cal-title" id="calTitle"></span>
        <div class="cal-actions">
          <button class="cal-today" data-action="calendar-today" title="回到今天" aria-label="回到今天">今</button>
          <button class="cal-pin" id="calPin" data-action="toggle-calendar-pin" title="固定在右侧" aria-label="固定在右侧"><svg><use href="#i-pin"></use></svg></button>
          <button data-action="calendar-next">&#8250;</button>
        </div>
      </div>
    </div>
    <div class="cal-body" id="calBody"></div>
  </div>
</div>
<div class="stor">
  <div class="stor-title">存储与同步</div>
  <div class="stor-statuses" id="storStatus">
    <div class="stor-status" id="linkStatus"><span class="dot-no"></span><span class="s-label">链接</span><span class="s-text">未挂载</span></div>
    <div class="stor-status" id="cloudStatus"><span class="dot-no"></span><span class="s-label">云端</span><span class="s-text">未保存</span></div>
  </div>
  <div class="stor-btns"><button class="primary" data-action="link-file">链接文件</button><button data-action="export-file">导出</button><button data-action="import-file">导入</button></div>
  <div class="stor-hint">链接文件：选择云盘同步目录中的 diary.json<br>导出/导入：手动备份恢复</div>
</div>

<div class="mount-gate" id="mountGate">
  <div class="mount-panel" id="mountPanel">
    <div class="mount-title">挂载同步文件</div>
    <div class="mount-copy">重力日记会先连接你的 diary.json，同步完成后再进入编辑模式，避免忘记挂载造成文件未同步。</div>
    <div class="mount-file" id="mountFile">正在检查上次同步文件...</div>
    <div class="mount-actions">
      <button class="primary" id="mountPrimary" data-action="mount-startup-file">加载上次同步文件</button>
      <button id="mountChoose" data-action="choose-and-mount-file" style="display:none">选择文件</button>
    </div>
    <div class="mount-conflict" id="mountConflict">
      <button data-action="resolve-mount-conflict" data-source="remote">使用云盘版本</button>
      <button class="danger" data-action="resolve-mount-conflict" data-source="local">使用本地版本</button>
    </div>
    <div class="merge-view" id="mergeView">
      <div class="merge-toolbar">
        <button data-action="load-merge-from" data-source="remote">载入云盘</button>
        <button data-action="load-merge-from" data-source="local">载入本地</button>
        <button class="primary" data-action="confirm-merged-conflict">保存合并版本</button>
      </div>
      <div class="merge-grid">
        <section class="merge-col">
          <h3>本地未同步</h3>
          <div class="merge-pane" id="mergeLocal"></div>
        </section>
        <section class="merge-col">
          <h3>合并版本</h3>
          <div class="merge-editor" id="mergeEditor" contenteditable="true"></div>
        </section>
        <section class="merge-col">
          <h3>云盘版本</h3>
          <div class="merge-pane" id="mergeRemote"></div>
        </section>
      </div>
    </div>
    <div class="mount-msg" id="mountMsg"></div>
  </div>
</div>

<div class="fbar" id="fbar">
  <button data-action="undo" title="撤销 (Ctrl+Z)" aria-label="撤销" id="undoBtn"><svg><use href="#i-undo"></use></svg></button>
  <button data-action="redo" title="重做 (Ctrl+Y)" aria-label="重做" id="redoBtn"><svg><use href="#i-redo"></use></svg></button>
  <span class="sep"></span>
  <button data-action="exec-command" data-command="bold" title="加粗" aria-label="加粗"><span class="txt">B</span></button>
  <button data-action="exec-command" data-command="italic" title="斜体" aria-label="斜体"><span class="txt italic">I</span></button>
  <button data-action="exec-command" data-command="underline" title="下划线" aria-label="下划线"><span class="txt"><u>U</u></span></button>
  <button data-action="exec-command" data-command="strikeThrough" title="删除线" aria-label="删除线"><span class="txt"><s>S</s></span></button>
  <span class="sep"></span>
  <button data-action="set-block-format" data-format="p" title="正文" aria-label="正文"><span class="txt body-style">T</span></button>
  <span class="sep"></span>
  <button data-action="show-table-dialog" title="表格" aria-label="表格"><svg><use href="#i-table"></use></svg></button>
  <button data-action="pick-image" title="图片" aria-label="图片"><svg><use href="#i-image"></use></svg></button>
  <span class="sep"></span>
  <span class="split">
    <button data-action="apply-highlight" title="水彩笔" aria-label="水彩笔" id="hlBtn" class="color-mark" style="--mark-color:#ffeb3b"><svg><use href="#i-highlighter"></use></svg></button>
    <button data-action="toggle-highlight-picker" title="选择水彩笔颜色" aria-label="选择水彩笔颜色" id="hlMenuBtn"><svg><use href="#i-chevron"></use></svg></button>
  </span>
  <span class="split">
    <button data-action="apply-text-color" title="字体颜色" aria-label="字体颜色" id="textColorBtn" class="color-mark" style="--mark-color:#111111"><svg><use href="#i-text-color"></use></svg></button>
    <button data-action="toggle-text-color-picker" title="选择字体颜色" aria-label="选择字体颜色" id="textColorMenuBtn"><svg><use href="#i-chevron"></use></svg></button>
  </span>
  <span class="sep"></span>
  <button data-action="toggle-dark" title="日夜模式" aria-label="日夜模式" id="darkBtn"><svg class="theme-moon"><use href="#i-moon"></use></svg><svg class="theme-sun"><use href="#i-sun"></use></svg></button>
  <button data-action="present-selection" title="全屏展示选中内容" aria-label="全屏展示选中内容" id="presentBtn" disabled><svg><use href="#i-present"></use></svg></button>
  <span class="st" id="st"></span>
</div>

<!-- Image toolbar -->
<div class="ctx-bar" id="imgBar">
  <button data-action="image-align" data-value="left">左对齐</button>
  <button data-action="image-align" data-value="center">居中</button>
  <button data-action="image-align" data-value="right">右对齐</button>
  <span class="sep"></span>
  <button data-action="image-size" data-value="25%">25%</button>
  <button data-action="image-size" data-value="50%">50%</button>
  <button data-action="image-size" data-value="75%">75%</button>
  <button data-action="image-size" data-value="100%">100%</button>
  <span class="sep"></span>
  <button data-action="image-delete">删除</button>
</div>

<!-- Table toolbar -->
<div class="ctx-bar" id="tblBar">
  <button data-action="table-add-row" data-value="before">上方插行</button>
  <button data-action="table-add-row" data-value="after">下方插行</button>
  <span class="sep"></span>
  <button data-action="table-add-col" data-value="before">左侧插列</button>
  <button data-action="table-add-col" data-value="after">右侧插列</button>
  <span class="sep"></span>
  <button data-action="table-delete-row">删除行</button>
  <button data-action="table-delete-col">删除列</button>
  <span class="sep"></span>
  <button data-action="table-delete" style="color:#e74c3c">删除表格</button>
</div>

<div class="img-modal" id="imgModal" data-action="close-image-modal"><img id="imgModalSrc" src=""></div>
<div class="presenter" id="presenter" role="dialog" aria-modal="true" aria-label="选中内容展示">
  <button class="presenter-close" data-action="close-presenter" aria-label="退出展示">×</button>
  <div class="laser-pointer" id="laserPointer"></div>
  <div class="presenter-menu" id="presenterMenu">
    <button type="button" data-action="set-presenter-tool" data-mode="laser">激光笔</button>
    <button type="button" data-action="set-presenter-tool" data-mode="draw">自由书写笔</button>
    <button type="button" data-action="set-presenter-tool" data-mode="lens">放大镜</button>
  </div>
  <div class="presenter-lens" id="presenterLens"><div class="presenter-lens-inner" id="presenterLensInner"></div></div>
  <div class="presenter-stage" id="presenterStage"><canvas class="presenter-draw" id="presenterDraw"></canvas><div class="presenter-content" id="presenterContent"></div></div>
</div>
<div class="td-dlg" id="tdDlg"><div class="td-dlg-in"><h3>插入表格</h3><label>行数</label><input type="number" id="tRows" value="3" min="1" max="20"><label>列数</label><input type="number" id="tCols" value="3" min="1" max="10"><div class="td-dlg-b"><button data-action="hide-table-dialog">取消</button><button class="ok" data-action="insert-table">插入</button></div></div></div>
<div class="tex-input" id="texInput"><textarea id="texArea" placeholder="输入 LaTeX，如 E=mc^2"></textarea><div class="ti-preview" id="texPreview"></div><div class="ti-btns"><button data-action="hide-tex-input">取消</button><button class="ok" data-action="confirm-tex">插入</button></div></div>
<div class="color-picker" id="hlPicker">
  <div class="color-grid" id="hlColors"></div>
</div>
<div class="color-picker" id="textColorPicker">
  <div class="color-grid" id="textColors"></div>
</div>
<div class="todo-editor" id="todoEditor">
  <input id="todoEditText" placeholder="事项内容" data-enter-action="save-todo-editor">
  <select id="todoEditCategory"></select>
  <div class="todo-editor-actions">
    <button data-action="close-todo-editor">取消</button>
    <button class="primary" data-action="save-todo-editor">保存</button>
  </div>
</div>
<input type="file" id="imgPicker" accept="image/*" style="display:none" data-change-action="handle-image-input">
<input type="file" id="importPicker" accept=".json" style="display:none" data-change-action="handle-import-input">

<script src="./src/core/date-bootstrap.js?v=20260524-calendar-room"></script>
<script src="./src/core/state-shell.js?v=20260524-calendar-room"></script>
<script src="./src/storage/schema.js?v=20260524-calendar-room"></script>
<script src="./src/storage/local-store.js?v=20260524-calendar-room"></script>
<script src="./src/storage/conflict.js?v=20260524-calendar-room"></script>
<script src="./src/storage/indexed-db.js?v=20260524-calendar-room"></script>
<script src="./src/storage/file-store.js?v=20260524-calendar-room"></script>
<script src="./src/editor/editor-richtext.js?v=20260524-calendar-room"></script>
<script src="./src/presenter/presenter.js?v=20260524-calendar-room"></script>
<script src="./src/ui/controls.js?v=20260524-calendar-room"></script>
<script src="./src/storage/storage-sync.js?v=20260524-calendar-room"></script>
<script src="./src/calendar/calendar.js?v=20260524-calendar-room"></script>
<script src="./src/ui/events.js?v=20260524-calendar-room"></script>
<script src="./src/core/boot.js?v=20260524-calendar-room"></script>
</body>
</html>
