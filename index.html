<style>

<script>
const STORAGE_KEY='diary_doc',DATES_KEY='diary_edit_dates';
let calView='month',calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),calWeekStart=getMon(new Date()),selectedDate=null,saveTimer=null;
let texDisplay=false,fileHandle=null,selImg=null;

const doc=document.getElementById('doc');
doc.innerHTML=localStorage.getItem(STORAGE_KEY)||'';
renderCal();restoreHandle();

// ===== Render on load =====
function waitForLibs(){
  if(typeof katex!=='undefined'&&typeof hljs!=='undefined'){
    renderAllContent();return;
  }
  setTimeout(waitForLibs,100);
}
waitForLibs();

function renderAllContent(){
  // Render LaTeX
  doc.querySelectorAll('.tex,.tex-display').forEach(el=>{
    const s=el.getAttribute('data-tex');
    if(s){try{katex.render(s,el,{throwOnError:false,displayMode:el.classList.contains('tex-display')})}catch(e){}}
  });
  // Highlight code
  doc.querySelectorAll('pre code').forEach(el=>{
    if(!el.classList.contains('hljs')){try{hljs.highlightElement(el)}catch(e){}}
  });
}

// ===== Auto-save =====
doc.addEventListener('input',()=>{
  showSt('saving');clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{save();showSt('saved')},600);
  // Trigger auto-render checks (also handles markdown shortcuts like ```python)
  setTimeout(()=>{autoRenderCheck()},0);
  // Real-time syntax highlighting in code blocks
  highlightCodeBlock();
});
doc.addEventListener('blur',()=>{clearTimeout(saveTimer);save()});
doc.addEventListener('keydown',function(e){
  if(e.key==='Enter'){handleMdEnter(e)}
  if(e.key==='Tab'){handleTab(e)}
});

let hlTimer=null;
function highlightCodeBlock(){
  clearTimeout(hlTimer);
  hlTimer=setTimeout(()=>{
    const s=window.getSelection();if(!s.rangeCount)return;
    let n=s.anchorNode;
    if(!n)return;
    const codeEl=n.nodeType===3?n.parentElement:n;
    if(!codeEl)return;
    const pre=codeEl.closest('pre');
    if(!pre)return;
    const code=pre.querySelector('code');
    if(!code||typeof hljs==='undefined')return;
    // Save cursor position as offset within text content
    const range=s.getRangeAt(0);
    const preRange=document.createRange();
    preRange.selectNodeContents(code);
    preRange.setEnd(range.startContainer,range.startOffset);
    const cursorOffset=preRange.toString().length;
    // Re-highlight
    code.removeAttribute('data-highlighted');
    try{hljs.highlightElement(code)}catch(e){}
    // Restore cursor
    restoreCursorInCode(code,cursorOffset);
  },300);
}

function restoreCursorInCode(code,offset){
  const walker=document.createTreeWalker(code,NodeFilter.SHOW_TEXT,null);
  let pos=0;
  while(walker.nextNode()){
    const node=walker.currentNode;
    if(pos+node.length>=offset){
      const range=document.createRange();
      range.setStart(node,offset-pos);
      range.collapse(true);
      const sel=window.getSelection();
      sel.removeAllRanges();sel.addRange(range);
      return;
    }
    pos+=node.length;
  }
}

function save(){

// ===== Auto-render: LaTeX + Inline Markdown + Block Shortcuts =====
function autoRenderCheck(){
  const s=window.getSelection();
  if(!s.rangeCount)return;
  let n=s.anchorNode;
  if(!n)return;

  // If inside a code block, skip
  if(n.nodeType===1&&n.closest&&n.closest('pre'))return;
  if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('pre'))return;

  // Get the text node
  if(n.nodeType!==3)return;

  const t=n.textContent;
  const off=s.anchorOffset;
  if(off<=0)return;
  const before=t.substring(0,off);

  // === Block-level shortcuts ===
  // Skip inline rendering if this looks like a code block fence in progress
  if(/```/.test(before))return;

  // Heading: # ~ ######
  const hm=before.match(/^(#{1,6})\s+$/);
  if(hm){n.textContent='';document.execCommand('formatBlock',false,'h'+hm[1].length);return}

  // Unordered list: - or * (alone on line)
  if(/^[-*]\s+$/.test(before)){n.textContent='';document.execCommand('insertUnorderedList');return}

  // Ordered list: 1. (alone on line)
  if(/^\d+\.\s+$/.test(before)){n.textContent='';document.execCommand('insertOrderedList');return}

  // Todo: - [ ] or - [x]
  const tm=before.match(/^- \[([ xX])\]\s+$/);
  if(tm){const checked=tm[1]!==' ';
    n.textContent='';
    const html='<div class="todo-item'+(checked?' checked':'')+'"><input type="checkbox"'+(checked?' checked':'')+'><span class="todo-text"><br></span></div>';
    document.execCommand('insertHTML',false,html);return;
  }

  // Blockquote: >
  if(/^>\s+$/.test(before)){n.textContent='';document.execCommand('formatBlock',false,'blockquote');return}

  // === Inline rendering ===
  // 1. Display math: $$...$$
  const dmIdx=before.lastIndexOf('$$');
  if(dmIdx>0){
    const openIdx=before.lastIndexOf('$$',dmIdx-1);
    if(openIdx>=0&&openIdx<dmIdx-1){
      const latex=before.substring(openIdx+2,dmIdx);
      const trailing=before.substring(dmIdx+2);
      if(latex.length>0&&!latex.includes('$$')&&trailing.trim()===''){
        doRenderLatex(n,openIdx,dmIdx+2,latex,true);
        return;
      }
    }
  }

  // 2. Inline math: $...$
  if(before.endsWith('$')&&before.length>1){
    let closeIdx=before.length-1;
    if(closeIdx>0&&before[closeIdx-1]==='$')return;
    let openIdx=-1;
    for(let i=closeIdx-1;i>=0;i--){
      if(before[i]==='$'){
        if(i>0&&before[i-1]==='$')continue;
        if(i+1<=closeIdx&&before[i+1]==='$')continue;
        openIdx=i;break;
      }
    }
    if(openIdx>=0&&closeIdx>openIdx+1){
      if(openIdx>0&&before[openIdx-1]==='$')return;
      const latex=before.substring(openIdx+1,closeIdx);
      if(latex.length>0&&!latex.includes('$')){
        doRenderLatex(n,openIdx,off,latex,false);
        return;
      }
    }
  }

  // 3. Inline code: `...`
  const cm=before.match(/`([^`]+)`$/);
  if(cm){const start=off-cm[0].length;doReplaceInline(n,start,off,cm[1],'code');return}

  // 4. Bold: **...**
  const bm=before.match(/\*\*([^*]+)\*\*$/);
  if(bm){const start=off-bm[0].length;doReplaceInline(n,start,off,bm[1],'b');return}

  // 5. Italic: *...* (not **)
  const im=before.match(/(?:^|[^*])\*([^*]+)\*$/);
  if(im){
    let openPos=-1;
    for(let i=before.length-2;i>=0;i--){
      if(before[i]==='*'&&(i===0||before[i-1]!=='*')&&(before[i+1]!=='*')){
        openPos=i;break;
      }
    }
    if(openPos>=0){
      const txt=before.substring(openPos+1,before.length-1);
      if(txt.length>0&&!txt.includes('*')){
        doReplaceInline(n,openPos,off,txt,'i');return;
      }
    }
  }
}

function doRenderLatex(node,start,end,latex,display){
  const before=node.textContent.substring(0,start);
  const after=node.textContent.substring(end);
  const parent=node.parentNode;
  if(!parent)return;

  const bf=document.createTextNode(before);
  const af=document.createTextNode(after||'​');
  const el=document.createElement('span');
  el.className=display?'tex-display':'tex';
  el.setAttribute('data-tex',latex);
  el.setAttribute('contenteditable','false');

  parent.insertBefore(bf,node);
  parent.insertBefore(el,node);
  parent.insertBefore(af,node);
  parent.removeChild(node);

  if(typeof katex!=='undefined'){
    try{katex.render(latex,el,{throwOnError:false,displayMode:display})}catch(e){el.textContent=latex}
  }

  // Cursor into the after-text node so user can keep typing / press Enter
  const sel=window.getSelection();const range=document.createRange();
  range.setStart(af,after?after.length:1);range.collapse(true);sel.removeAllRanges();sel.addRange(range);
  save();
}

function doReplaceInline(node,start,end,text,tag){
  const before=node.textContent.substring(0,start);
  const after=node.textContent.substring(end);
  const parent=node.parentNode;
  if(!parent)return;

  const bf=document.createTextNode(before);
  const af=document.createTextNode(after||'​');
  const el=document.createElement(tag);
  el.textContent=text;

  parent.insertBefore(bf,node);
  parent.insertBefore(el,node);
  parent.insertBefore(af,node);
  parent.removeChild(node);

  const sel=window.getSelection();const range=document.createRange();
  range.setStart(af,after?after.length:1);range.collapse(true);sel.removeAllRanges();sel.addRange(range);
  save();
}

function getCursorBlock(){
  const s=window.getSelection();if(!s.rangeCount)return null;
  let n=s.anchorNode;
  while(n&&n!==doc){
    if(n.nodeType===1&&['P','DIV','H1','H2','H3','H4','LI','BLOCKQUOTE'].includes(n.nodeName))return n;
    n=n.parentNode;
  }
  return null;
}

function handleMdEnter(e){
  // Code block: ``` or ```python — triggered by Enter
  const s=window.getSelection();if(s.rangeCount){
    const n=s.anchorNode;
    if(n&&n.nodeType===3){
      const t=n.textContent;const off=s.anchorOffset;
      const before=t.substring(0,off);
      const clm=before.match(/^```(\w+)$/);
      if(clm||/^```$/.test(before)){
        e.preventDefault();
        const block=getCursorBlock();
        const lang=clm?clm[1]:'plaintext';
        const pre=document.createElement('pre');
        const code=document.createElement('code');
        code.className='language-'+lang;
        code.appendChild(document.createElement('br'));
        pre.appendChild(code);
        const langEl=document.createElement('span');
        langEl.className='code-lang';langEl.setAttribute('contenteditable','false');langEl.textContent=lang;
        pre.appendChild(langEl);
        const dots=document.createElement('span');
        dots.className='code-dots';dots.setAttribute('contenteditable','false');dots.textContent='···';
        pre.appendChild(dots);
        if(block){block.replaceWith(pre);}else{n.textContent='';doc.insertBefore(pre,null);}
        const p=document.createElement('p');p.appendChild(document.createElement('br'));
        pre.after(p);
        const sel2=window.getSelection();const range=document.createRange();
        range.setStart(code,0);range.collapse(true);sel2.removeAllRanges();sel2.addRange(range);
        save();return;
      }
    }
  }

  const blk=getCursorBlock();if(!blk)return;
  // Empty list item → exit list
  if(blk.nodeName==='LI'&&blk.textContent.trim()===''){
    e.preventDefault();document.execCommand('outdent');
    const blk2=getCursorBlock();
    if(blk2&&blk2.nodeName==='LI')document.execCommand('formatBlock',false,'p');
    return;
  }
  // Continue todo
  if(blk.classList&&blk.classList.contains('todo-item')){
    e.preventDefault();
    document.execCommand('insertHTML',false,'</div><div class="todo-item"><input type="checkbox"><span class="todo-text"><br></span></div>');
  }
}

function handleTab(e){
  const blk=getCursorBlock();if(!blk)return;
  if(blk.nodeName==='LI'){e.preventDefault();e.shiftKey?document.execCommand('outdent'):document.execCommand('indent')}
}

function switchView(v){calView=v;renderCal()}
function navPrev(){if(calView==='month'){calMonth--;if(calMonth<0){calMonth=11;calYear--}}else if(calView==='year')calYear--;else if(calView==='day'){const d=new Date(calYear,calMonth,selectedDate?+selectedDate.split('-')[2]:new Date().getDate());d.setDate(d.getDate()-1);calYear=d.getFullYear();calMonth=d.getMonth();selectedDate=ds(d)}else if(calView==='week')calWeekStart=addD(calWeekStart,-7);renderCal()}
function navNext(){if(calView==='month'){calMonth++;if(calMonth>11){calMonth=0;calYear++}}else if(calView==='year')calYear++;else if(calView==='day'){const d=new Date(calYear,calMonth,selectedDate?+selectedDate.split('-')[2]:new Date().getDate());d.setDate(d.getDate()+1);calYear=d.getFullYear();calMonth=d.getMonth();selectedDate=ds(d)}else if(calView==='week')calWeekStart=addD(calWeekStart,7);renderCal()}
function renderCal(){const m={day:'vDay',week:'vWeek',month:'vMonth',year:'vYear'};document.querySelectorAll('.cal-views button').forEach(b=>b.classList.remove('active'));document.getElementById(m[calView]).classList.add('active');const title=document.getElementById('calTitle'),body=document.getElementById('calBody');if(calView==='month'){title.textContent=calYear+'年'+(calMonth+1)+'月';body.innerHTML='<div class="cal-month">'+monthGrid(calYear,calMonth)+'</div>'}else if(calView==='year'){title.textContent=calYear+'年';let h='<div class="cal-year">';for(let i=0;i<12;i++)h+='<div class="mm" onclick="calYear='+calYear+';calMonth='+i+';switchView(\'month\')"><div class="mm-t">'+(i+1)+'月</div>'+monthGrid(calYear,i)+'</div>';h+='</div>';body.innerHTML=h}else if(calView==='day'){if(!selectedDate)selectedDate=todayStr();const p=selectedDate.split('-');calYear=+p[0];calMonth=+p[1]-1;title.textContent=fmtD(selectedDate);body.innerHTML=dayView(selectedDate);scrollNow()}else if(calView==='week'){title.textContent=fmtDs(ds(calWeekStart))+' — '+fmtDs(ds(addD(calWeekStart,6)));body.innerHTML=weekView(calWeekStart);scrollNowW()}}
function monthGrid(y,m){const wd=['一','二','三','四','五','六','日'],f=new Date(y,m,1);let sd=f.getDay();sd=sd===0?6:sd-1;const dim=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate(),td=todayStr(),ed=new Set(getDates());let h='<div class="cal-wk">';wd.forEach(w=>h+='<span>'+w+'</span>');h+='</div><div class="cal-days">';for(let i=sd-1;i>=0;i--)h+='<span class="cal-d om">'+(pd-i)+'</span>';for(let d=1;d<=dim;d++){const s=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');let c='cal-d';if(s===td)c+=' td';if(s===selectedDate)c+=' sel';h+='<span class="'+c+'" onclick="selDate(\''+s+'\')">'+d+(ed.has(s)?'<span class="dot"></span>':'')+'</span>'}const tc=sd+dim,rm=(7-tc%7)%7;for(let i=1;i<=rm;i++)h+='<span class="cal-d om">'+i+'</span>';h+='</div>';return h}
function dayView(s){let h='<div class="dv"><div class="dv-hd">'+fmtD(s)+'</div><div class="dv-tl" id="dvTl">';for(let i=0;i<24;i++){const l=String(i).padStart(2,'0');h+='<div class="dv-hr"><div class="dv-lb">'+l+':00</div><div class="dv-sl"></div></div>'}if(s===todayStr()){const n=new Date(),t=n.getHours()*60+n.getMinutes(),top=t/(24*60)*(24*32);h+='<div class="dv-now" style="top:'+top+'px"></div>'}h+='</div></div>';return h}
function scrollNow(){requestAnimationFrame(()=>{const t=document.getElementById('dvTl');if(!t)return;const n=new Date(),top=(n.getHours()*60+n.getMinutes())/(24*60)*t.scrollHeight;t.scrollTop=top-t.clientHeight/3})}
function weekView(mon){const td=todayStr();let h='<div class="wv"><div class="wv-hd"><div class="wv-gt"></div><div class="wv-dhs">';for(let i=0;i<7;i++){const d=addD(mon,i),s=ds(d);h+='<div class="wv-dh'+(s===td?' td':'')+(s===selectedDate?' sel':'')+'" onclick="selDate(\''+s+'\')">'+WN[i]+'<span class="wn">'+d.getDate()+'</span></div>'}h+='</div></div><div class="wv-bd" id="wvBd"><div class="wv-tc">';for(let i=0;i<24;i++)h+='<div class="wv-tl">'+String(i).padStart(2,'0')+'</div>';h+='</div><div class="wv-cols">';for(let i=0;i<7;i++){h+='<div class="wv-col">';for(let j=0;j<24;j++)h+='<div class="wv-cl"></div>';h+='</div>'}h+='</div>';if(td>=ds(mon)&&td<=ds(addD(mon,6))){const n=new Date(),t=n.getHours()*60+n.getMinutes(),top=t/(24*60)*(24*32);h+='<div class="wv-now" style="top:'+top+'px"></div>'}h+='</div></div>';return h}
function scrollNowW(){requestAnimationFrame(()=>{const b=document.getElementById('wvBd');if(!b)return;const n=new Date(),top=(n.getHours()*60+n.getMinutes())/(24*60)*b.scrollHeight;b.scrollTop=top-b.clientHeight/3})}
function selDate(s){selectedDate=s;const p=s.split('-');calYear=+p[0];calMonth=+p[1]-1;renderCal();doc.focus()}
</script>
